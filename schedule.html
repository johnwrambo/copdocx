<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Schedule</title>
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body data-page="schedule" data-admin-page="schedule">
    <header class="app-bar">
      <div class="app-bar-info">
        <span class="app-bar-product">COPDoc</span>
        <span
          id="appVersion"
          class="app-version"
          data-version="0.25.0"
        >
          Version 0.25.0
        </span>
        <span id="currentDate" class="app-bar-date"></span>
      </div>
      <div class="app-bar-navrow" id="appBarNavRow"></div>
      <p id="appBarStatus" class="app-bar-status" hidden></p>
    </header>

    <div class="page page-wide">
      <fieldset class="card-static">
        <legend>Add shift</legend>
        <p class="section-note" id="scheduleWeekLabel">This week</p>
        <div class="row row-4">
          <div class="field">
            <label for="shiftDate">Date</label>
            <input type="date" id="shiftDate" />
          </div>
          <div class="field">
            <label for="shiftOfficer">Officer</label>
            <select id="shiftOfficer">
              <option value="">Select an officer</option>
            </select>
          </div>
          <div class="field">
            <label for="shiftVehicle">Vehicle</label>
            <select id="shiftVehicle">
              <option value="">None</option>
            </select>
          </div>
          <div class="field">
            <label for="shiftAssignment">Assignment</label>
            <select id="shiftAssignment">
              <option value="field">Field</option>
              <option value="transport">Transport</option>
              <option value="office">Office</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="shiftStart">Start</label>
            <input type="time" id="shiftStart" value="06:00" />
          </div>
          <div class="field">
            <label for="shiftEnd">End</label>
            <input type="time" id="shiftEnd" value="14:00" />
          </div>
          <div class="field">
            <label class="field-label-spacer" for="addShiftButton">Add</label>
            <button type="button" id="addShiftButton" class="action-button">
              Add shift
            </button>
          </div>
        </div>
      </fieldset>

      <fieldset class="card-static">
        <legend>This week</legend>
        <div class="week-grid-wrap">
          <div id="weekGrid" class="week-grid"></div>
        </div>
        <div id="shiftsEmpty" class="records-empty">No shifts this week.</div>
        <div id="shiftsTableWrap" class="records-table-wrap" hidden>
          <table class="records-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Officer</th>
                <th>Vehicle</th>
                <th>Hours</th>
                <th>Assignment</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="shiftsBody"></tbody>
          </table>
        </div>
      </fieldset>
    </div>

    <script src="functions/app-bar.js"></script>
    <script src="functions/transfer.js"></script>
    <script src="functions/date.js"></script>
    <script src="functions/cards.js"></script>
    <script src="functions/model/util.js"></script>
    <script src="functions/model/location.js"></script>
    <script src="functions/model/vehicle.js"></script>
    <script src="functions/model/officer.js"></script>
    <script src="functions/model/autosave.js"></script>
    <script src="functions/admin.js"></script>
  </body>
</html>
