<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Issue I-205</title>
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body data-page="i205-form" data-form-type="I-205">
    <header class="app-bar">
      <div class="app-bar-info">
        <span class="app-bar-product">COPDoc</span>
        <span
          id="appVersion"
          class="app-version"
          data-version="0.11.1"
        >
          Version 0.11.1
        </span>
        <span id="currentDate" class="app-bar-date"></span>
      </div>
      <div class="app-bar-navrow" id="appBarNavRow"></div>
      <p id="appBarStatus" class="app-bar-status" hidden></p>
    </header>

    <div class="page page-wide">
      <p id="warrantMissing" class="records-empty" hidden>Lead not found.</p>
      <div id="warrantForm">
        <fieldset class="card-static">
          <legend>I-205 Warrant of Removal/Deportation</legend>
          <p class="section-note">
            Subject: <strong id="warrantSubjectName">—</strong>
            · A-Number: <strong id="warrantSubjectFileNo">—</strong>
          </p>
          <div class="row">
            <div class="field">
              <label for="fileNo">File No</label>
              <input type="text" id="fileNo" autocomplete="off" />
            </div>
            <div class="field">
              <label for="issueDate">Date</label>
              <input type="text" id="issueDate" autocomplete="off" />
            </div>
          </div>
          <div class="row">
            <div class="field">
              <label for="entryPlace">Place of entry</label>
              <input type="text" id="entryPlace" autocomplete="off" />
            </div>
            <div class="field">
              <label for="entryDate">Date of entry</label>
              <input type="text" id="entryDate" autocomplete="off" />
            </div>
          </div>
          <div class="row">
            <div class="field field-span-2">
              <label for="inaLaw">INA law</label>
              <input type="text" id="inaLaw" autocomplete="off" />
            </div>
          </div>
        </fieldset>

        <fieldset class="card-static">
          <legend>Order issued by</legend>
          <div class="check-grid">
            <label>
              <input type="checkbox" id="orderIJ" />
              immigration judge (exclusion, deportation, or removal)
            </label>
            <label>
              <input type="checkbox" id="orderOfficial" />
              a designated official
            </label>
            <label>
              <input type="checkbox" id="orderBIA" />
              Board of Immigration Appeals
            </label>
            <label>
              <input type="checkbox" id="orderCourt" />
              U.S. District or Magistrate Court Judge
            </label>
          </div>
        </fieldset>

        <fieldset class="card-static">
          <legend>Issuing officer</legend>
          <div class="row row-4">
            <div class="field">
              <label for="issuingOfficer">Issuing officer</label>
              <select id="issuingOfficer"></select>
            </div>
            <div class="field">
              <label for="officerTitle">Title</label>
              <input type="text" id="officerTitle" autocomplete="off" />
            </div>
            <div class="field field-span-2">
              <label for="issuingOffice">Location (office)</label>
              <input type="text" id="issuingOffice" autocomplete="off" />
            </div>
          </div>
          <p class="section-note">
            Execution, fingerprint, and departure blocks stay blank until removal.
            Signature fields stay empty so the PDF can be digitally signed in Acrobat.
          </p>
        </fieldset>
      </div>
    </div>

    <script src="functions/app-bar.js"></script>
    <script src="functions/date.js"></script>
    <script src="functions/alien-number.js"></script>
    <script src="functions/model/util.js"></script>
    <script src="functions/model/lead.js"></script>
    <script src="functions/model/person.js"></script>
    <script src="functions/model/store.js"></script>
    <script src="functions/pdf/i200-map.js"></script>
    <script src="functions/pdf/i205-map.js"></script>
    <script src="functions/pdf/fill-warrant.js"></script>
    <script src="functions/warrant-issue.js"></script>
  </body>
</html>
