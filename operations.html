<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Operations</title>
    <link rel="stylesheet" href="style/style.css" />
    <script src="functions/workspace-config.js"></script>
    <script src="functions/privacy-gate.js"></script>
  </head>
  <body data-page="operations">
    <header class="app-bar">
      <div class="app-bar-info">
        <span class="app-bar-product">COPDoc</span>
        <span
          id="appVersion"
          class="app-version"
          data-version="0.67.0"
        >
          Version 0.67.0
        </span>
        <span id="currentDate" class="app-bar-date"></span>
      </div>
      <div class="app-bar-navrow" id="appBarNavRow"></div>
      <p id="appBarStatus" class="app-bar-status" hidden></p>
    </header>

    <div class="page page-wide">
      <fieldset class="card-static">
        <legend>Operations</legend>
        <p class="section-note">
          One packet, many targets. Plan the job, issue it, send the operation sheet to the shift.
        </p>
        <div class="record-filter-chips" role="group" aria-label="Filter operations">
          <button type="button" data-record-filter="all" aria-pressed="true">All</button>
          <button type="button" data-record-filter="draft" aria-pressed="false">Working</button>
          <button type="button" data-record-filter="committed" aria-pressed="false">Filed</button>
        </div>
        <div id="operationsEmpty" class="records-empty">No operations yet.</div>
        <div id="operationsTableWrap" class="records-table-wrap" hidden>
          <table class="records-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Window</th>
                <th>Targets</th>
                <th>Updated</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="operationsBody"></tbody>
          </table>
        </div>
      </fieldset>
    </div>

    <script src="functions/app-bar.js"></script>
    <script src="functions/transfer.js"></script>
    <script src="functions/date.js"></script>
    <script src="functions/model/util.js"></script>
    <script src="functions/model/operation.js"></script>
    <script src="functions/model/store.js"></script>
    <script src="functions/operations.js"></script>
  </body>
</html>
