<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Map</title>
    <link rel="stylesheet" href="style/style.css" />
    <script src="functions/workspace-config.js"></script>
    <script src="functions/document-context.js"></script>
    <script src="functions/document-registry.js"></script>
    <script src="functions/document-fingerprints.js"></script>
    <script src="functions/document-generation.js"></script>
    <script src="functions/baseball-card-contract.js"></script>
    <script src="functions/import-schema.js"></script>
    <script src="functions/import-workflow.js"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <body data-page="map">
    <!--
      Map-first shell. Overlays on the viewport. Dock = layers + list.
      Writes: views, layers, icons, markup keys. Not leads/admin/book-in.
    -->
    <header class="app-bar">
      <div class="app-bar-info">
        <span class="app-bar-product">COPDoc</span>
        <span
          id="appVersion"
          class="app-version"
          data-version="0.69.2"
        >
          Version 0.69.2
        </span>
        <span id="currentDate" class="app-bar-date"></span>
      </div>
      <div class="app-bar-navrow" id="appBarNavRow"></div>
      <p id="appBarStatus" class="app-bar-status" hidden></p>
    </header>

    <div class="map-shell">
      <div class="map-stage">
        <div class="map-overlay map-overlay-basemap">
          <div class="map-basemap" role="group" aria-label="Basemap">
            <button type="button" data-basemap="map" aria-pressed="true">
              Map
            </button>
            <button type="button" data-basemap="satellite" aria-pressed="false">
              Sat
            </button>
            <button type="button" data-basemap="hybrid" aria-pressed="false">
              Hyb
            </button>
          </div>
        </div>
        <div class="map-overlay map-overlay-markup" role="group" aria-label="Markup">
          <button type="button" id="mapMarkupLabel" class="action-button-secondary">
            Label
          </button>
          <button type="button" id="mapMarkupArrow" class="action-button-secondary">
            Arrow
          </button>
          <button type="button" id="mapMarkupDelete" class="action-button-secondary">
            Del
          </button>
        </div>
        <div class="map-overlay map-overlay-view">
          <button type="button" id="mapHomeButton" class="action-button">
            Home
          </button>
          <details class="map-view-menu">
            <summary>View</summary>
            <div class="map-view-menu-list">
              <button type="button" id="mapSetHomeButton">Set home</button>
              <button type="button" id="mapSavePresetButton">Save preset</button>
              <select id="mapPresetSelect" aria-label="Saved map views">
                <option value="">No presets yet</option>
              </select>
              <button type="button" id="mapDeletePresetButton">Delete preset</button>
            </div>
          </details>
        </div>
        <div class="map-overlay map-overlay-icon-size">
          <div class="map-icon-size-row">
            <label for="mapIconSizeSlider">Size</label>
            <input
              id="mapIconSizeSlider"
              class="map-icon-size-slider"
              type="range"
              min="20"
              max="56"
              step="1"
              value="32"
              aria-valuemin="20"
              aria-valuemax="56"
              aria-valuenow="32"
              aria-valuetext="32 pixels"
              aria-label="Map icon size"
            />
            <span id="mapIconSizeValue" class="map-icon-size-value">32</span>
          </div>
          <div class="map-icon-size-row">
            <label for="mapIconStrokeSlider">Line</label>
            <input
              id="mapIconStrokeSlider"
              class="map-icon-size-slider"
              type="range"
              min="1"
              max="4"
              step="1"
              value="2"
              aria-valuemin="1"
              aria-valuemax="4"
              aria-valuenow="2"
              aria-valuetext="2 pixels"
              aria-label="Map icon line thickness"
            />
            <span id="mapIconStrokeValue" class="map-icon-size-value">2</span>
          </div>
          <div class="map-icon-size-row">
            <label for="mapIconFillSlider">Trans</label>
            <input
              id="mapIconFillSlider"
              class="map-icon-size-slider"
              type="range"
              min="0"
              max="100"
              step="5"
              value="40"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="40"
              aria-valuetext="40 percent fill"
              aria-label="Map icon fill transparency"
            />
            <span id="mapIconFillValue" class="map-icon-size-value">40%</span>
          </div>
        </div>
        <p id="mapViewHint" class="map-view-hint" hidden></p>
        <div
          id="map"
          class="map"
          role="application"
          aria-label="Planning map"
        ></div>
      </div>

      <aside class="map-dock targets-card" id="mapDock" data-dock-tab="layers">
        <div class="map-dock-header">
          <div class="map-dock-tabs" role="tablist" aria-label="Map dock">
            <button
              type="button"
              role="tab"
              id="mapDockTabLayers"
              data-dock-tab="layers"
              aria-selected="true"
              aria-controls="mapDockPanelLayers"
            >
              Layers
            </button>
            <button
              type="button"
              role="tab"
              id="mapDockTabIcons"
              data-dock-tab="icons"
              aria-selected="false"
              aria-controls="mapDockPanelIcons"
            >
              Icons
            </button>
          </div>
          <button
            type="button"
            id="mapDockToggle"
            class="map-dock-toggle"
            aria-expanded="true"
            aria-controls="mapDockBody"
            title="Collapse dock"
          >
            <span class="map-dock-toggle-collapse" aria-hidden="true">«</span>
            <span class="map-dock-toggle-edge">Layers</span>
          </button>
        </div>
        <div class="map-dock-body" id="mapDockBody">
          <div
            id="mapDockPanelLayers"
            class="map-dock-panel is-layers"
            role="tabpanel"
            aria-labelledby="mapDockTabLayers"
          >
            <div
              id="mapLayerList"
              class="map-layer-list"
              role="list"
              aria-label="Map layers"
            ></div>
            <p id="targetsEmpty" class="targets-empty">
              No ranked locations with coordinates.
            </p>
            <div class="map-list-tools">
              <button
                type="button"
                class="map-reveal-all"
                data-map-reveal-all
              >
                Reveal all
              </button>
            </div>
            <div class="targets-table-wrap">
              <table class="targets-table">
                <thead id="mapListHead"></thead>
                <tbody id="targetsTableBody"></tbody>
              </table>
            </div>
          </div>
          <div
            id="mapDockPanelIcons"
            class="map-dock-panel is-icons"
            role="tabpanel"
            aria-labelledby="mapDockTabIcons"
            hidden
          >
            <div class="map-icon-library">
              <div
                class="map-icon-options"
                id="mapIconOptions"
                role="group"
                aria-label="Icon options"
              >
                <button
                  type="button"
                  data-icon-option="labels"
                  aria-pressed="false"
                >
                  Names
                </button>
                <button
                  type="button"
                  data-icon-option="badges"
                  aria-pressed="true"
                >
                  Rank
                </button>
                <button
                  type="button"
                  id="mapRevealAll"
                  class="map-reveal-all"
                  data-map-reveal-all
                >
                  Reveal all
                </button>
              </div>
              <div
                class="map-icon-filters"
                id="mapIconFilters"
                aria-label="Visual filters"
              ></div>
              <p id="mapIconFilterNote" class="section-note">
                Eyes show or hide that class on the map. Regular is every target or encounter that is not on this list.
              </p>
              <div class="map-icon-library-picker" id="mapIconLibraryPicker">
                <label for="mapIconLibrarySelect">Icon library</label>
                <select
                  id="mapIconLibrarySelect"
                  aria-describedby="mapIconLibraryDescription"
                ></select>
                <p id="mapIconLibraryDescription"></p>
              </div>
              <div id="mapIconPalette" class="map-icon-palette"></div>
              <p id="mapIconHint" class="section-note">
                Select an icon, then a layer or a row.
              </p>
            </div>
          </div>
        </div>
      </aside>
    </div>

    <div id="mapBriefLegend" class="map-brief-legend" hidden></div>
    <button type="button" id="mapBriefExit" class="action-button map-brief-exit" hidden>
      Exit brief
    </button>

    <script src="functions/app-bar.js"></script>
    <script src="functions/date.js"></script>
    <script src="functions/model/util.js"></script>
    <script src="functions/model/person.js"></script>
    <script src="functions/model/store.js"></script>
    <script src="functions/model/media.js"></script>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="assets/icons/copdoc-icons.js"></script>
    <script src="functions/map-popup.js"></script>
    <script src="functions/map-views.js"></script>
    <script src="functions/map.js"></script>
    <script src="functions/map-targets.js"></script>
    <script src="functions/map-markup.js"></script>
  </body>
</html>
