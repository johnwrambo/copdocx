<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maps and Planning</title>
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body data-page="map">
    <header class="app-bar">
      <div class="app-bar-info">
        <span class="app-bar-product">COPDoc</span>
        <span
          id="appVersion"
          class="app-version"
          data-version="0.5.3"
        >
          Version 0.5.3
        </span>
        <span id="currentDate" class="app-bar-date"></span>
      </div>
      <div class="app-bar-navrow" id="appBarNavRow"></div>
      <p id="appBarStatus" class="app-bar-status" hidden></p>
    </header>
    <div class="page">
      <fieldset>
        <legend>Map</legend>
        <div class="map"></div>
      </fieldset>
    </div>
    <script src="functions/app-bar.js"></script>
    <script src="functions/date.js"></script>
  </body>
</html>
