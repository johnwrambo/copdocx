<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Officers</title>
    <link rel="stylesheet" href="style/style.css" />
    <script src="functions/workspace-config.js"></script>
    <script src="functions/privacy-gate.js"></script>
  </head>
  <body data-page="officers" data-admin-page="officers">
    <header class="app-bar">
      <div class="app-bar-info">
        <span class="app-bar-product">COPDoc</span>
        <span
          id="appVersion"
          class="app-version"
          data-version="0.67.0"
        >
          Version 0.67.0
        </span>
        <span id="currentDate" class="app-bar-date"></span>
      </div>
      <div class="app-bar-navrow" id="appBarNavRow"></div>
      <p id="appBarStatus" class="app-bar-status" hidden></p>
    </header>

    <div class="page page-wide">
      <fieldset class="card-static">
        <legend>Roster</legend>
        <p class="section-note">All officers. Open View for the current snapshot, or Add officer to create one.</p>
        <div class="record-filter-chips" role="group" aria-label="Filter officers">
          <button type="button" data-record-filter="all" aria-pressed="true">All</button>
          <button type="button" data-record-filter="draft" aria-pressed="false">Working</button>
          <button type="button" data-record-filter="committed" aria-pressed="false">Filed</button>
          <button type="button" data-record-filter="junk" aria-pressed="false">Junk</button>
        </div>
        <div id="officersEmpty" class="records-empty">No officers yet.</div>
        <div id="officersTableWrap" class="records-table-wrap" hidden>
          <table class="records-table">
            <thead>
              <tr>
                <th>Last name</th>
                <th>City</th>
                <th>Duty</th>
                <th>EOD</th>
                <th>Role</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="officersBody"></tbody>
          </table>
        </div>
      </fieldset>
    </div>

    <script src="functions/app-bar.js"></script>
    <script src="functions/transfer.js"></script>
    <script src="functions/date.js"></script>
    <script src="functions/cards.js"></script>
    <script src="functions/model/util.js"></script>
    <script src="functions/model/location.js"></script>
    <script src="functions/model/vehicle.js"></script>
    <script src="functions/model/officer.js"></script>
    <script src="functions/model/autosave.js"></script>
    <script src="functions/admin-disposition.js"></script>
    <script src="functions/admin.js"></script>
  </body>
</html>
