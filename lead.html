<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lead</title>
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body data-page="lead">
    <header class="app-bar">
      <div class="app-bar-info">
        <span class="app-bar-product">COPDoc</span>
        <span
          id="appVersion"
          class="app-version"
          data-version="0.11.1"
        >
          Version 0.11.1
        </span>
        <span id="currentDate" class="app-bar-date"></span>
      </div>
      <div class="app-bar-navrow" id="appBarNavRow"></div>
      <p id="appBarStatus" class="app-bar-status" hidden></p>
    </header>

    <div class="page page-wide">
      <fieldset class="card-static">
        <legend id="leadViewTitle">Lead</legend>
        <p class="section-note">Current snapshot. Edit to change the record.</p>
        <div id="leadMissing" class="records-empty" hidden>Lead not found.</div>
        <div id="leadSnapshot">
          <div class="snapshot-grid">
            <div class="snapshot-item">
              <p class="snapshot-label">Name</p>
              <p id="viewName" class="snapshot-value">—</p>
            </div>
            <div class="snapshot-item">
              <p class="snapshot-label">Source / case</p>
              <p id="viewSource" class="snapshot-value">—</p>
            </div>
            <div class="snapshot-item">
              <p class="snapshot-label">Sex</p>
              <p id="viewSex" class="snapshot-value">—</p>
            </div>
            <div class="snapshot-item">
              <p class="snapshot-label">Date of birth / age</p>
              <p id="viewDobAge" class="snapshot-value">—</p>
            </div>
            <div class="snapshot-item">
              <p class="snapshot-label">Citizenship</p>
              <p id="viewCitizenship" class="snapshot-value">—</p>
            </div>
            <div class="snapshot-item">
              <p class="snapshot-label">A-Number</p>
              <p id="viewAlienNumber" class="snapshot-value">—</p>
            </div>
            <div class="snapshot-item snapshot-span">
              <p class="snapshot-label">Address</p>
              <p id="viewAddress" class="snapshot-value">—</p>
            </div>
            <div class="snapshot-item">
              <p class="snapshot-label">Plate</p>
              <p id="viewPlate" class="snapshot-value">—</p>
            </div>
            <div class="snapshot-item">
              <p class="snapshot-label">Updated</p>
              <p id="viewUpdated" class="snapshot-value">—</p>
            </div>
          </div>
        </div>
      </fieldset>

      <fieldset class="card-static" id="warrantsIssuedCard">
        <legend>Warrants issued</legend>
        <p id="warrantsIssuedEmpty" class="records-empty">
          No I-200 or I-205 issued yet.
        </p>
        <div id="warrantsIssuedTableWrap" hidden>
          <table class="records-table">
            <thead>
              <tr>
                <th>Form</th>
                <th>Date</th>
                <th>File no</th>
                <th>Officer</th>
                <th>File</th>
              </tr>
            </thead>
            <tbody id="warrantsIssuedBody"></tbody>
          </table>
        </div>
      </fieldset>
    </div>

    <script src="functions/app-bar.js"></script>
    <script src="functions/date.js"></script>
    <script src="functions/lead-source.js"></script>
    <script src="functions/model/util.js"></script>
    <script src="functions/model/lead.js"></script>
    <script src="functions/model/person.js"></script>
    <script src="functions/model/location.js"></script>
    <script src="functions/model/store.js"></script>
    <script src="functions/leads.js"></script>
    <script src="functions/lead-csv.js"></script>
  </body>
</html>
