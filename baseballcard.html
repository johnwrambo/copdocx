<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Baseball Card</title>
    <link rel="stylesheet" href="style/style.css" />
    <style>
      .baseball-card-editor {
        min-height: 14rem;
        padding: 0.65rem 0.75rem;
        border: 1px solid var(--ns-line-strong);
        border-radius: 3px;
        background: var(--ns-ink);
        color: var(--ns-text);
        font: inherit;
        line-height: 1.45;
        white-space: pre-wrap;
      }
      .baseball-card-editor:focus {
        outline: 2px solid var(--ns-teal);
        outline-offset: 2px;
      }
      .baseball-card-editor p {
        margin: 0 0 0.75rem;
      }
      .baseball-card-editor .baseball-bullets {
        margin: 0.35rem 0 0 1.5rem;
        padding: 0;
      }
      .baseball-card-editor .baseball-bullets li {
        margin: 0.45rem 0;
        white-space: pre-wrap;
      }
      .criminal-history-row {
        display: grid;
        gap: 0.75rem 1rem;
        margin-bottom: 0.75rem;
        padding-bottom: 0.75rem;
        border-bottom: 1px dashed var(--ns-line);
      }
      @media (min-width: 640px) {
        .criminal-history-row {
          grid-template-columns: 1fr 1fr 1fr;
        }
      }
      .criminal-history-row label {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }
    </style>
  </head>
  <body data-page="baseballcard">
    <header class="app-bar">
      <div class="app-bar-info">
        <span class="app-bar-product">COPDoc</span>
        <span
          id="appVersion"
          class="app-version"
          data-version="0.59.0"
        >
          Version 0.59.0
        </span>
        <span id="currentDate" class="app-bar-date"></span>
      </div>
      <div class="app-bar-navrow" id="appBarNavRow"></div>
      <p id="appBarStatus" class="app-bar-status" hidden></p>
    </header>

    <div class="page page-wide">
      <fieldset class="card-static">
        <legend>Subject</legend>
        <div class="row row-4">
          <div class="field">
            <label for="lastName">Last name</label>
            <input type="text" id="lastName" autocomplete="off" />
          </div>
          <div class="field">
            <label for="firstName">First name</label>
            <input type="text" id="firstName" autocomplete="off" />
          </div>
          <div class="field">
            <label for="age">Age</label>
            <input type="number" id="age" />
          </div>
          <div class="field">
            <label for="country">Country</label>
            <input type="text" id="country" autocomplete="off" />
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="alienNumber">A-Number</label>
            <input type="text" id="alienNumber" autocomplete="off" />
          </div>
          <div class="field">
            <label for="arrestDate">Arrest date</label>
            <input type="date" id="arrestDate" />
          </div>
          <div class="field checkbox-field">
            <input type="checkbox" id="isCriminal" name="isCriminal" disabled />
            <label for="isCriminal">Criminal</label>
          </div>
        </div>
      </fieldset>

      <fieldset class="card-static">
        <legend>Immigration</legend>
        <div class="row">
          <div class="field">
            <label for="disposition">Disposition</label>
            <input type="text" id="disposition" autocomplete="off" />
          </div>
          <div class="field">
            <label for="finalOrderDate">Final order date</label>
            <input type="date" id="finalOrderDate" />
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="firstDeportationDate">First deportation date</label>
            <input type="date" id="firstDeportationDate" />
          </div>
          <div class="field">
            <label for="lastDeportationDate">Last deportation date</label>
            <input type="date" id="lastDeportationDate" />
          </div>
        </div>
      </fieldset>

      <fieldset class="card-static">
        <legend>Criminal history</legend>
        <div id="criminalHistoryList"></div>
        <button type="button" id="addCriminalHistory" class="action-button-secondary">
          Add charge
        </button>
      </fieldset>

      <fieldset class="card-static">
        <legend>Baseball card</legend>
        <label for="baseballCardEditor" class="section-note">Generated text. Edit before copying.</label>
        <div
          id="baseballCardEditor"
          class="baseball-card-editor"
          contenteditable="true"
        ></div>
      </fieldset>
    </div>

    <script src="functions/app-bar.js"></script>
    <script src="functions/date.js"></script>
    <script src="functions/alien-number.js"></script>
    <script src="data/countries.js"></script>
    <script src="data/immigration.js"></script>
    <script src="functions/model/util.js"></script>
    <script src="functions/model/lead.js"></script>
    <script src="functions/model/person.js"></script>
    <script src="functions/model/store.js"></script>
    <script src="functions/baseballcard.js"></script>
    <script src="functions/baseball-page.js"></script>
  </body>
</html>
