<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Operation sheet</title>
    <link rel="stylesheet" href="style/style.css" />
    <script src="functions/workspace-config.js"></script>
    <script src="functions/document-context.js"></script>
    <script src="functions/document-registry.js"></script>
    <script src="functions/document-fingerprints.js"></script>
    <script src="functions/repositories/browser-storage.js"></script>
    <script src="functions/repositories/document-generations.js"></script>
    <script src="functions/application/document-generation.js"></script>
    <script src="functions/document-generation.js"></script>
    <script src="functions/baseball-card-contract.js"></script>
    <script src="functions/import-schema.js"></script>
    <script src="functions/application/import.js"></script>
    <script src="functions/ui/import-dialogs.js"></script>
    <script src="functions/repositories/recovery.js"></script>
    <script src="functions/import-workflow.js"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <body data-page="operation-brief">
    <header class="app-bar">
      <div class="app-bar-info">
        <span class="app-bar-product">COPDoc</span>
        <span
          id="appVersion"
          class="app-version"
          data-version="0.69.2"
        >
          Version 0.69.2
        </span>
        <span id="currentDate" class="app-bar-date"></span>
      </div>
      <div class="app-bar-navrow" id="appBarNavRow"></div>
      <p id="appBarStatus" class="app-bar-status" hidden></p>
    </header>

    <main class="mobile-fow-page">
      <nav class="mobile-fow-pagebar" aria-label="Operation sheet">
        <div class="mobile-fow-pagebar-title">
          <span>Operation sheet</span>
          <small>Nested Target sheets</small>
        </div>
      </nav>

      <p id="operationBriefMissing" class="records-empty" hidden>
        Issue an operation with targets, then Generate brief.
      </p>

      <article id="operationBriefSheet" class="operation-brief-sheet" hidden>
        <header class="operation-brief-head">
          <p class="fow-target-band">
            <span class="fow-target-mark">Operation</span>
            <span class="fow-target-copy">Law enforcement use only</span>
          </p>
          <p>
            <strong id="briefNumber"></strong>
            ·
            <span id="briefName"></span>
          </p>
          <p>Window: <span id="briefWindow"></span></p>
          <p id="briefNarrative"></p>
        </header>

        <div class="case-map-layout operation-map-layout">
          <p id="operationMapEmpty" class="records-empty">No mapped places.</p>
          <div
            id="operationMap"
            class="location-map lead-case-map"
            data-location-map
            hidden
            role="img"
            aria-label="Operation map"
          ></div>
          <ul id="operationMapList" class="case-map-list" hidden></ul>
        </div>

        <section id="briefTargetSheets" aria-label="Target sheets"></section>
        <section id="briefOfficerCards" aria-label="Officer briefs"></section>
      </article>
    </main>

    <script src="functions/repositories/admin.js"></script>
    <script src="functions/app-bar.js"></script>
    <script src="functions/application/transfer.js"></script>
    <script src="functions/repositories/transfer.js"></script>
    <script src="functions/transfer.js"></script>
    <script src="functions/date.js"></script>
    <script src="functions/names.js"></script>
    <script src="functions/model/util.js"></script>
    <script src="functions/model/lead.js"></script>
    <script src="functions/model/person.js"></script>
    <script src="functions/model/location.js"></script>
    <script src="functions/model/vehicle.js"></script>
    <script src="functions/model/officer.js"></script>
    <script src="functions/application/admin.js"></script>
    <script src="functions/officer-roster.js"></script>
    <script src="functions/model/operation.js"></script>
    <script src="functions/domain/canonical-records.js"></script>
    <script src="functions/domain/encounter-subject-policy.js"></script>
    <script src="functions/projections/encounter-completion.js"></script>
    <script src="functions/domain/booking-projection.js"></script>
    <script src="functions/model/store.js"></script>
    <script src="functions/model/media.js"></script>
    <script src="functions/repositories/view-state.js"></script>
    <script src="assets/icons/copdoc-icons.js"></script>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="functions/map-popup.js"></script>
    <script src="functions/location-map.js"></script>
    <script src="functions/operations.js"></script>
  </body>
</html>
