<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Officer</title>
    <link rel="stylesheet" href="style/style.css" />
    <script src="functions/workspace-config.js"></script>
    <script src="functions/baseball-card-contract.js"></script>
    <script src="functions/import-schema.js"></script>
    <script src="functions/application/import.js"></script>
    <script src="functions/ui/import-dialogs.js"></script>
    <script src="functions/repositories/browser-storage.js"></script>
    <script src="functions/repositories/recovery.js"></script>
    <script src="functions/import-workflow.js"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <body data-page="officer" data-admin-page="officer-view">
    <header class="app-bar">
      <div class="app-bar-info">
        <span class="app-bar-product">COPDoc</span>
        <span
          id="appVersion"
          class="app-version"
          data-version="0.69.2"
        >
          Version 0.69.2
        </span>
        <span id="currentDate" class="app-bar-date"></span>
      </div>
      <div class="app-bar-navrow" id="appBarNavRow"></div>
      <p id="appBarStatus" class="app-bar-status" hidden></p>
    </header>

    <div class="page page-wide">
      <fieldset class="card-static">
        <legend id="officerViewTitle">Officer</legend>
        <p class="section-note">Current snapshot. Edit to change the record.</p>
        <div id="officerMissing" class="records-empty" hidden>Officer not found.</div>
        <div id="officerSnapshot" class="media-view-layout">
          <div id="officerMedia" class="media-block"></div>
          <div id="officerSnapshotSide" class="snapshot-side">
            <div id="officerSnapshotFacts" class="snapshot-facts"></div>
            <div id="officerSnapshotFiles" class="snapshot-files" hidden></div>
          </div>
        </div>
      </fieldset>

      <fieldset class="card-static" id="officerCaseMapCard">
        <legend>Officer map</legend>
        <p id="officerCaseMapEmpty" class="records-empty">
          No mapped locations. Resolve an address on the form.
        </p>
        <div class="case-map-layout">
          <div
            id="officerCaseMap"
            class="location-map lead-case-map"
            data-location-map
            hidden
            role="img"
            aria-label="Officer home and work locations"
          ></div>
          <div id="officerCaseMapLegend" class="case-map-legend" hidden>
            <ul id="officerCaseMapList" class="case-map-list"></ul>
          </div>
        </div>
      </fieldset>

      <fieldset class="card-static" id="officerLocationsCard">
        <legend>Locations</legend>
        <p id="officerLocationsEmpty" class="records-empty">No locations.</p>
        <div id="officerLocations" class="case-object-list" hidden></div>
      </fieldset>

      <fieldset class="card-static" id="officerQualsCard">
        <legend>Qualifications</legend>
        <p id="viewQuals" class="snapshot-value">—</p>
      </fieldset>

      <fieldset class="card-static" id="officerEquipCard">
        <legend>Equipment issued</legend>
        <p id="viewEquip" class="snapshot-value">—</p>
        <p id="viewEquipNotes" class="field-caption"></p>
      </fieldset>
    </div>

    <script src="functions/repositories/admin.js"></script>
    <script src="functions/app-bar.js"></script>
    <script src="functions/application/transfer.js"></script>
    <script src="functions/repositories/transfer.js"></script>
    <script src="functions/transfer.js"></script>
    <script src="functions/date.js"></script>
    <script src="functions/cards.js"></script>
    <script src="functions/model/util.js"></script>
    <script src="functions/model/location.js"></script>
    <script src="functions/model/vehicle.js"></script>
    <script src="functions/model/officer.js"></script>
    <script src="functions/model/autosave.js"></script>
    <script src="functions/model/media.js"></script>
    <script src="functions/media-card.js"></script>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="functions/repositories/view-state.js"></script>
    <script src="assets/icons/copdoc-icons.js"></script>
    <script src="functions/map-popup.js"></script>
    <script src="functions/location-map.js"></script>
    <script src="functions/admin-disposition.js"></script>
    <script src="functions/application/admin.js"></script>
    <script src="functions/officer-roster.js"></script>
    <script src="functions/admin.js"></script>
    <script src="functions/photo-picker-modal.js"></script>
  </body>
</html>
